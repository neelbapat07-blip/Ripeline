<!doctype html><html><head><style>
body{margin:0;font-family:"Inter Display",Inter,sans-serif}
.wrap{display:flex;align-items:center;gap:28px;padding:40px 56px;background:#fff;width:max-content}
.wrap.dark{background:#1f1f1f}
.word{font-weight:800;font-size:96px;letter-spacing:-3px;color:#2b2b2b;line-height:1}
.dark .word{color:#fff}
.word span{color:#ff6a3d}.dark .word span{color:#ff8a5c}
img{width:128px;height:128px}
</style></head><body>
<div class="wrap" id="light"><img src="icon.svg"><div class="word">Ripe<span>line</span></div></div>
<div class="wrap dark" id="dark"><img src="icon.svg"><div class="word">Ripe<span>line</span></div></div>
<div id="icon" style="width:512px;height:512px"><img src="icon.svg" style="width:512px;height:512px"></div>
</body></html>
